services:
  app:
    image: 0xhurricane/todo-app:v1
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/todos.sqlite
      - STATIC_DIR=/app/frontend/dist
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - todo-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/todos"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  todo-data:
    driver: local
