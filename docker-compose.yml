services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/todos.sqlite
      - STATIC_DIR=/app/frontend/dist
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - todo-data:/app/data
    restart: unless-stopped

volumes:
  todo-data:
    driver: local

